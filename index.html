<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caminho ao STF</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #1a202c; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .game-container { background: #2d3748; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 15px; color: #63b3ed; }
        .stats { display: flex; justify-content: space-around; background: #4a5568; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        .question-box { margin-bottom: 20px; font-size: 1.1rem; line-height: 1.4; min-height: 80px; }
        button { background: #3182ce; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; margin-bottom: 10px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        button:active { background: #2b6cb0; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Caminho ao STF</h1>
        <div class="stats">
            <div>⚖️ Prestígio: <span id="prestigio">50</span></div>
            <div>⏳ Turno: <span id="turno">1</span>/5</div>
        </div>
        <div class="question-box" id="pergunta">A carregar o desafio...</div>
        <div id="opcoes"></div>
    </div>

    <script>
        const questoes = [
            {
                texto: "Um recurso de grande repercussão geral chega à tua mesa. O que decides priorizar?",
                opcoes: [
                    { texto: "Analisar a jurisprudência estrita.", prestigio: +10 },
                    { texto: "Considerar o impacto social imediato.", prestigio: +5 }
                ]
            },
            {
                texto: "Surpreende-te um impasse processual entre instâncias inferiores. Qual a tua postura?",
                opcoes: [
                    { texto: "Emitir súmula vinculante para alinhar entendimentos.", prestigio: +15 },
                    { texto: "Aguardar novos debates doutrinários.", prestigio: -5 }
                ]
            }
        ];

        let atual = 0;
        let prestigio = 50;

        function atualizarJogo() {
            if (atual < questoes.length) {
                document.getElementById("turno").innerText = atual + 1;
                document.getElementById("prestigio").innerText = prestigio;
                document.getElementById("pergunta").innerText = questoes[atual].texto;
                
                const divOpcoes = document.getElementById("opcoes");
                divOpcoes.innerHTML = "";
                
                questoes[atual].opcoes.forEach((opcao) => {
                    const btn = document.createElement("button");
                    btn.innerText =opcao.texto;
                    btn.onclick = () => {
                        prestigio += opcao.prestigio;
                        atual++;
                        atualizarJogo();
                    };
                    divOpcoes.appendChild(btn);
                });
            } else {
                document.querySelector(".game-container").innerHTML = `
                    <h1>Fim da Jornada!</h1>
                    <p style="margin: 20px 0;">Chegaste ao STF com ${prestigio} pontos de prestígio.</p>
                    <button onclick="location.reload()">Jogar Novamente</button>
                `;
            }
        }

        // Registo do Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker registado com sucesso!"));
        }

        atualizarJogo();
    </script>
</body>
</html>
