<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Capa - Caminho ao STF</title>
    <style>
        body { background: #0f172a; color: white; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
        canvas { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-width: 100%; height: auto; margin-bottom: 20px; border: 2px solid #334155; }
        .btn-download { background: #2563eb; color: white; border: none; padding: 14px 28px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.2s; box-shadow: 0 4px 14px rgba(37,99,235,0.4); }
        .btn-download:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 8px; font-size: 1.4rem; color: #38bdf8;">🏛️ Imagem Oficial do STF</h1>
    <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px;">Capa institucional em alta resolução para apresentação do app</p>

    <canvas id="splashCanvas" width="1080" height="1920"></canvas>

    <a id="downloadBtn" class="btn-download" download="caminho-ao-stf-capa.png">📥 Baixar Imagem de Apresentação (1080x1920)</a>

    <script>
        const canvas = document.getElementById('splashCanvas');
        const ctx = canvas.getContext('2d');

        // Fundo Gradiente Institucional Noturno (Tom de Tribunal / Sépia escuro)
        const grad = ctx.createLinearGradient(0, 0, 0, 1920);
        grad.addColorStop(0, '#090d16');
        grad.addColorStop(0.5, '#1e293b');
        grad.addColorStop(1, '#0f172a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1080, 1920);

        // Elementos Geométricos Decorativos (Colunas/Estrutura do Tribunal)
        ctx.fillStyle = 'rgba(56, 189, 248, 0.03)';
        ctx.fillRect(150, 0, 120, 1920);
        ctx.fillRect(810, 0, 120, 1920);

        // Círculo de Destaque Central (Glow Dourado/Azul)
        const centerGlow = ctx.createRadialGradient(540, 850, 50, 540, 850, 450);
        centerGlow.addColorStop(0, 'rgba(2, 132, 199, 0.25)');
        centerGlow.addColorStop(1, 'rgba(15, 23, 42, 0)');
        ctx.fillStyle = centerGlow;
        ctx.beginPath();
        ctx.arc(540, 850, 450, 0, Math.PI * 2);
        ctx.fill();

        // Moldura Decorativa Superior e Inferior
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 8;
        ctx.strokeRect(60, 60, 960, 1800);

        // Ícone / Símbolo da Balança
        ctx.font = '180px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚖️', 540, 750);

        // Título Principal
        ctx.font = 'bold 72px system-ui, sans-serif';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText('CAMINHO AO STF', 540, 1020);

        // Subtítulo
        ctx.font = '600 36px system-ui, sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('SUPREMO TRIBUNAL FEDERAL', 540, 1100);

        // Linha Divisória Dourada/Azul
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(340, 1180, 400, 4);

        // Descrição do Jogo na Capa
        ctx.font = '400 28px system-ui, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Simulação Estratégica do Plenário', 540, 1260);
        ctx.fillText('Teses, Gabinetes e Julgamentos Históricos', 540, 1320);

        // Rodapé Institucional
        ctx.font = 'bold 22px system-ui, sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.fillText('EDIÇÃO SUPREMA • MOBILE APP', 540, 1750);

        // Ligar o link de download direto
        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = canvas.toDataURL('image/png');
    </script>
</body>
</html>
